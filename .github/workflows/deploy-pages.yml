name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Enable GitHub Pages once in repository Settings > Pages > Build and deployment > Source.
      # The Actions token cannot create the Pages site for this repository.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build static site
        run: npm run build
        env:
          GITHUB_PAGES: "true"

      - name: Verify required Pages files
        run: |
          test -f ./out/index.html
          test -f ./out/origin/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published homepage and Origin route
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$PAGE_URL"
          curl --fail --show-error --silent --retry 10 --retry-delay 10 --retry-all-errors "$PAGE_URL" -o /tmp/pages-home.html
          curl --fail --show-error --silent --retry 10 --retry-delay 10 --retry-all-errors "${PAGE_URL%/}/origin/" -o /tmp/pages-origin.html
          grep -q "PROJECT" /tmp/pages-origin.html
