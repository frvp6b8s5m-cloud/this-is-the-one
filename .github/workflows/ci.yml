name: CI

on:
  push:
    branches:
      - main
      - planning/bzaudio-foundation
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bzaudio-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Commit generated lockfile to the approved feature branch
        if: github.ref == 'refs/heads/planning/bzaudio-foundation' || github.head_ref == 'planning/bzaudio-foundation'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f package-lock.json ] && ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build: commit generated npm lockfile"
            git push origin HEAD:refs/heads/planning/bzaudio-foundation
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Production build
        run: npm run build
