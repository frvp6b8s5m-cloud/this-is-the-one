name: CI

on:
  push:
    branches:
      - main
      - planning/bzaudio-foundation
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bzaudio-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Upload generated lockfile for reproducible-install bootstrap
        uses: actions/upload-artifact@v4
        with:
          name: bzaudio-lockfile-bootstrap
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Production build
        run: npm run build
